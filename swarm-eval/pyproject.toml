[project]
name = "swarm-eval"
version = "0.1.0"
description = "Inspect-side swarm eval: bridged Claude Code agents probing Android app anti-root defenses"
readme = "README.md"
authors = [
    { name = "whangshihee", email = "whangse123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.4.0",
    # Pinned floor; uv.lock holds the exact resolved version. Held stable so a model
    # sweep varies only the served model, never the harness under it (spec S2).
    "inspect-ai>=0.3.263",
    "inspect-swe==0.2.70",
    "openai>=3.14.1",
    # Reads the device yaml Python-side (swarm_eval/target.py). Already installed transitively
    # (via inspect-ai); declared here so the direct import is a first-class, pinned dependency.
    "pyyaml>=6",
]
# NOTE (swarm-improvements ticket 04): the post-run report (`report.py`) synthesizes insights via
# the vendored safety-tooling submodule (repo root `safety-tooling/`). It is deliberately NOT a
# resolved dependency here: safety-tooling hard-pins anthropic==0.49.0, openai==1.70.0 and
# pydantic==2.11.1, each mutually exclusive with this harness's pins (anthropic 1.4.0 / openai
# 3.x / inspect-swe's pydantic>=2.13) — `uv lock` is provably unsatisfiable with it in-tree. So
# `report.safetytooling_infer` runs the call in the submodule's OWN environment via
# `uv run --project ../safety-tooling`, keeping the harness resolution (and the model sweep, S2)
# untouched. The pure `run_reader` imports no safetytooling at all.


[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# tests import the root-level entrypoint (dynamic_agent.py) and the package under src/.
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
