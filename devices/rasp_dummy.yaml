# Device-spec: RASP dummy target (com.example.rasptarget, label "RASP Target") — an owned
# graded RASP/anti-tamper target (dummy-apks corpus). Single self-contained APK -> adb install -r.
# Main activity: com.example.rasptarget.MainActivity (min sdk 24, target sdk 34).
# The APK lives in the untracked in-project corpus at apks/rasp_dummy/rasp_dummy.apk.
#   bin/env-up  --spec devices/rasp_dummy.yaml
#   bin/verify  --spec devices/rasp_dummy.yaml
#   bin/env-down --spec devices/rasp_dummy.yaml

name: rasp_dummy                # AVD name + adb tag
device_profile: pixel           # avdmanager -d <profile>
system_image: "system-images;android-37.1;google_apis_ps16k;arm64-v8a"
api: "37.1"                     # env-up asserts config.ini target == android-37.1

ram_mb: 4096                    # hw.ramSize
cores: 4                        # hw.cpu.ncore
data_size_mb: 8192              # disk.dataPartition.size

# --- ticket 04: provisioning ---
# APK lives in the untracked in-project corpus (apks/, gitignored). Path is repo-relative;
# env-up/bin/verify resolve it against CWD then the repo root (apk_resolve_path).
target_apk: "apks/rasp_dummy/rasp_dummy.apk"
provision: true
frida: true
normalize_settings: true
headless: true                  # false -> boot with a visible window (or run env-up --window)
