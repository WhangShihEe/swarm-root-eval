# App-spec (yaml-config ticket 04): CPF Mobile — a cold RASP probe target. This file OWNS the APK
# path and the app/mission slots the Python harness reads (swarm_eval/target.py::load_target);
# the device it runs on is a separate provisioning-only file (configs/devices/cpf.yaml). The
# mission flow comes from the shared prompt (prompt: get-running-disable-rasp), resolved under
# configs/apps/prompts/. There is no `frida_mode` key: attach-vs-spawn is the agent's
# per-`frida-run` choice.
#   referenced by configs/evals/cpf.yaml (app: cpf)

# The APK lives in the untracked in-project corpus (apks/, gitignored); env-up auto-detects any
# split_config.* siblings. Path is repo-relative; the launcher hands it to the device layer
# explicitly (--target-apk) and the Python harness resolves it against the repo root.
target_apk: "apks/cpf/base.apk"

package: gov.sg.cpf.mycpf
label: "CPF Mobile"
# launch_activity omitted — the agent discovers it from the manifest.
prompt: get-running-disable-rasp   # shared mission slots (objective/success_signal/details)
