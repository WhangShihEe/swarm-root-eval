# SOLUTION eval (env-hardening ticket 02) — the CHEAP validation ORACLE for the dbs near-miss.
#
# This is an ordinary single-agent eval, EXCEPT its top-level `prompt_append:` HANDS the agent the
# answer (the bypass recipe) so it executes mechanically instead of discovering under rate-limit
# backoff — the point is to prove the ENVIRONMENT (resident frida `-k` + auto-foreground, shipped by
# env-hardening ticket 01) converts dbs from a near-miss into a COMPLETED RASP bypass that reaches
# the real UI, WITHOUT paying for a full cold discovery run.
#
# `prompt_append` is a per-run mission ADDENDUM read ONLY off this eval config's top level
# (target.py + mission.build_mission). The canonical cold prompt (configs/apps/prompts/
# get-running-disable-rasp.yaml) and the app spec (configs/apps/dbs.yaml) are UNTOUCHED — the
# answer lives only in this throwaway solution file, so no committed spec states a bypass.
#
#   python single_agent.py configs/evals/dbs_solution.yaml
#
# Counterpart: configs/evals/dbs.yaml is the COLD discovery eval (no answer) — run that to measure
# whether the agent FINDS the bug from cold; run THIS one to validate the environment cheaply.

app: dbs               # -> configs/apps/dbs.yaml  (target_apk + the cold mission slots)
device: pixel          # -> configs/devices/pixel.yaml  (shared provisioning-only emulator)

workers:
  - role: dynamic
    count: 1

# This environment authenticates only the LiteLLM proxy (LITELLM_API_KEY/LITELLM_BASE_URL in
# swarm-eval/.env; no ANTHROPIC_API_KEY), so pin the served model to the openai-api/litellm path.
# --model still overrides for a run (CLI > config > built-in default).
model: openai-api/litellm/bedrock-claude-opus-4.8

# Tighter than a discovery run: the agent is handed the answer, so cap working time low. Rate-limit
# backoff dominates WALL time, so keep a higher wall budget under the low working-time limit.
limits:
  time_limit: 1200      # Inspect --time-limit (working seconds) — 600 proved too tight even w/ the answer
  budget: 1800          # launcher hard wall-clock ceiling (s)
  cap: 6

# The ANSWER, appended verbatim AFTER the cold mission (mission.build_mission). It seeds the recipe
# — the detection surface + the resident/foreground tooling that was the actual gap — and narrows
# the goal to phase 1-2 only (stop at bypass; skip the phase-3 exploit), so this stays a fast,
# cheap environment check rather than a full assessment.
prompt_append: |-
  ── VALIDATION RUN — YOU ARE HANDED THE SOLUTION (do not rediscover it) ──
  This is an environment self-test, not a cold assessment. Your ONLY job is to get dbs (DBS
  digibank) to a STABLE, RESUMED real UI and keep it there, using the recipe below, then STOP. Do
  NOT sink time into a full decompile — the protection is already identified for you (see below).

  OBSERVED BEHAVIOUR ON THIS IMAGE (do not re-derive this — start from it):
    - A plain `adb shell am start -n com.dbs.sg.dbsmbanking/com.dbs.sg.digibank.ui.demo.SplashActivity`
      DOES reach a real pre-login UI: the app resumes
      `com.dbs.sg.digibank.ui.vbonboarding.VBOnboardingMFEPreLoginActivity` (a genuine onboarding
      screen, NOT a "device unsupported"/rooted block). So a hard startup block is NOT what stops you.
    - BUT the app is then reaped/backgrounded — `topResumedActivity` falls back to the Nexus launcher
      shortly after — i.e. the cached-apps freezer (`do_freezer_trap`) and/or a DELAYED V-Key
      integrity verdict backgrounds or kills the process. THAT is the wall: the app will not STAY at
      its UI.
    - The protection is V-Key VGuard (native-backed): classes under `com.vkey.android.vguard`
      (notably `VGuardFactory$Callback`, the threat callback) plus native `libvos*/libvguard*.so`.
      You do NOT need to decompile the whole app — go straight to a targeted frida hook on the
      VGuard threat callback / the DBS handler that acts on its verdict.

  THE RECIPE — resident frida is the whole point (this is the environment capability under test):
    1. THE HOOK. Author a small frida Java hook that suppresses the V-Key threat verdict so the app
       is not backgrounded/killed: neutralize `com.vkey.android.vguard.VGuardFactory$Callback`
       (make its threat/onThreat-style callback report "no threat" / a clean status), or no-op the
       DBS handler that reacts to it. Keep it minimal.
    2. THE TOOLING (the environment capability this run validates). Load that hook under RESIDENT
       frida with auto-foreground so it fires AND stays effective while the app runs:
           frida-run -f com.dbs.sg.dbsmbanking -l /tmp/hook.js -k -t 0 &
       `-k` (resident) keeps the session and hook LIVE past your `done` — a `done` no longer tears
       it down; `-t 0` holds until you `kill` it. The `-f` spawn is auto-foregrounded (activity-
       manager `am start`) so the process leaves the freezer and the guarded code runs. Do NOT pass
       `--no-foreground`. Then, while the hook is held resident, confirm the app STAYS at a real UI.

  SUCCESS = phases 1-2 only: after your resident hook is loaded, `adb shell dumpsys activity
  activities | grep com.dbs.sg.dbsmbanking` shows a dbs activity RESUMED and it STAYS resumed (not
  reaped back to the launcher) for a sustained window, a `uiautomator dump` / `screencap` shows the
  real screen, and `adb logcat -d` shows no fatal crash. Leave the app running and print the raw
  evidence. STOP THERE — do NOT attempt phase 3 (any exploit / security finding).

  If, after applying the recipe, the app STILL will not STAY at its UI, report precisely where it
  fell back and whether the blocker is still tooling/environment or now genuine V-Key hardness —
  that clear blocker report is itself a valid, successful outcome for this run.
